name: Auto-merge zengin-pl pin

# A CI success is evidence, not approval. Only an explicit owner dispatch bound
# to the PR number and exact head SHA may invoke the checked merge/deploy path.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '承認するpin更新PR番号。CI成功後に実行するとmergeとdeployを開始します。'
        required: true
        type: string
      head_sha:
        description: '承認するPRの最新head SHA（40桁）。更新後は新しい承認が必要です。'
        required: true
        type: string

concurrency:
  group: auto-merge-zengin-pl
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  auto-merge:
    if: >-
      github.repository == 'sironekotoro/zengin-pl-api' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'sironekotoro' &&
      github.triggering_actor == 'sironekotoro'
    outputs:
      merged_sha: ${{ steps.merge.outputs.merged_sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - id: merge
        name: Verify explicit approval and merge only if safe
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/auto-merge-zengin-pl-pr.sh

  deploy:
    needs: auto-merge
    if: needs.auto-merge.outputs.merged_sha != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      commit_sha: ${{ needs.auto-merge.outputs.merged_sha }}
