name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: zengin-pl-api
  REGION: asia-northeast1
  REPOSITORY: zengin-pl-api
  SERVICE: zengin-pl-api
  MAX_INSTANCES: '3'
  IMAGE: asia-northeast1-docker.pkg.dev/zengin-pl-api/zengin-pl-api/zengin-pl-api:${{ inputs.commit_sha || github.sha }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: Reject stale or non-main deployment
        env:
          DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'

      - name: Install test dependencies
        run: |
          cpanm --notest --installdeps .

      - name: Run tests
        env:
          # test.ymlと同じ理由(Test2::Formatter::TAPのhandle複製タイミング
          # 問題)によるWide character in print対策。詳細はtest.ymlのコメント参照。
          PERL5OPT: -MTest2::Plugin::UTF8=encoding_only
        run: |
          prove -lr t

      - name: Set build metadata
        run: |
          echo "APP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Resolve zengin-pl revision
        run: |
          source bin/lib/zengin-pl-verify.sh
          ZENGIN_PL_GIT_REF="$(read_pin_file zengin-pl.ref)"

          echo "Using zengin-pl revision: $ZENGIN_PL_GIT_REF"
          echo "ZENGIN_PL_GIT_REF=$ZENGIN_PL_GIT_REF" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --build-arg ZENGIN_PL_GIT_REF="${ZENGIN_PL_GIT_REF}" \
            -t "${IMAGE}" \
            .

      - name: Start API container
        run: |
          docker run -d --rm --name zengin-pl-api-contract-test -p 5000:8080 -e PORT=8080 "${IMAGE}"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/meta >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs zengin-pl-api-contract-test
          exit 1

      - name: Smoke test API
        run: |
          curl -fsS http://127.0.0.1:5000/api/banks/0001 | grep '"code":"0001"'
          curl -fsS http://127.0.0.1:5000/api/banks/0001/branches/001 | grep '"branch"'
          curl -fsS -G --data-urlencode 'name=東京' http://127.0.0.1:5000/api/banks/0001/branches | grep '"branches"'

      - name: Validate running API against OpenAPI
        uses: schemathesis/action@v3.0.0
        with:
          schema: openapi.yaml
          base-url: http://127.0.0.1:5000
          version: '4.25.2'
          checks: not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance
          max-examples: '10'
          coverage: 'false'
          args: --phases examples,coverage --exclude-tag Slack --seed 1 --no-color

      - name: Stop API container
        if: always()
        run: |
          docker rm -f zengin-pl-api-contract-test || true

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth
        run: |
          gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Recheck main before publishing
        env:
          DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"

      - name: Push image
        run: |
          docker push "${IMAGE}"

      - name: Recheck main before Cloud Run update
        env:
          DEPLOY_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: '--max=${{ env.MAX_INSTANCES }}'
          env_vars: |
            APP_NAME=zengin-pl-api
            APP_VERSION=${{ github.ref_name }}
            APP_GIT_SHA=${{ inputs.commit_sha || github.sha }}
            APP_BUILD_TIME=${{ env.APP_BUILD_TIME }}

      - name: Verify deployed API revision
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ inputs.commit_sha || github.sha }}
        run: bash bin/verify-deployment.sh "$SERVICE_URL" "$EXPECTED_SHA"

      - name: Show service URL
        run: |
          echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"

