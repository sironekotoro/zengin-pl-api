name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: zengin-pl-api
  REGION: asia-northeast1
  REPOSITORY: zengin-pl-api
  SERVICE: zengin-pl-api
  MAX_INSTANCES: '3'
  IMAGE: asia-northeast1-docker.pkg.dev/zengin-pl-api/zengin-pl-api/zengin-pl-api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'

      - name: Install test dependencies
        run: |
          cpanm --notest --installdeps .

      - name: Run tests
        run: |
          prove -lr t

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth
        run: |
          gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Set build metadata
        run: |
          echo "APP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Resolve zengin-pl revision
        run: |
          ZENGIN_PL_GIT_REF="$(cat zengin-pl.ref)"

          if [ "$(wc -l < zengin-pl.ref)" -ne 1 ] || \
            ! printf '%s' "$ZENGIN_PL_GIT_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "zengin-pl.ref must contain exactly one 40-character commit SHA" >&2
            exit 1
          fi

          echo "Using zengin-pl revision: $ZENGIN_PL_GIT_REF"
          echo "ZENGIN_PL_GIT_REF=$ZENGIN_PL_GIT_REF" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --build-arg ZENGIN_PL_GIT_REF="${ZENGIN_PL_GIT_REF}" \
            -t "${IMAGE}" \
            .

      - name: Start API container
        run: |
          docker run -d --rm --name zengin-pl-api-contract-test -p 5000:8080 -e PORT=8080 "${IMAGE}"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/meta >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs zengin-pl-api-contract-test
          exit 1

      - name: Smoke test API
        run: |
          curl -fsS http://127.0.0.1:5000/api/banks/0001 | grep '"code":"0001"'
          curl -fsS http://127.0.0.1:5000/api/banks/0001/branches/001 | grep '"branch"'
          curl -fsS -G --data-urlencode 'name=東京' http://127.0.0.1:5000/api/banks/0001/branches | grep '"branches"'

      - name: Validate running API against OpenAPI
        uses: schemathesis/action@v3.0.0
        with:
          schema: openapi.yaml
          base-url: http://127.0.0.1:5000
          version: '4.25.2'
          checks: not_a_server_error,status_code_conformance,content_type_conformance,response_schema_conformance
          max-examples: '10'
          coverage: 'false'
          args: --phases examples,coverage --exclude-tag Slack --seed 1 --no-color

      - name: Stop API container
        if: always()
        run: |
          docker rm -f zengin-pl-api-contract-test || true

      - name: Push image
        run: |
          docker push "${IMAGE}"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: '--max=${{ env.MAX_INSTANCES }}'
          env_vars: |
            APP_NAME=zengin-pl-api
            APP_VERSION=${{ github.ref_name }}
            APP_GIT_SHA=${{ github.sha }}
            APP_BUILD_TIME=${{ env.APP_BUILD_TIME }}

      - name: Show service URL
        run: |
          echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"
